<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Cable Route Workbench: a cable route and its vertices. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c365c"/>
      <stop offset="1" stop-color="#36597a"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="22" height="22" rx="4.5" fill="url(#bg)"/>
  <polyline points="5.5,17.5 9.5,9 14.5,14 18.5,6.5" fill="none" stroke="#f5a623" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#1c365c" stroke="#e3ecf5" stroke-width="1.3">
    <circle cx="5.5" cy="17.5" r="1.7"/>
    <circle cx="9.5" cy="9" r="1.7"/>
    <circle cx="14.5" cy="14" r="1.7"/>
    <circle cx="18.5" cy="6.5" r="1.7"/>
  </g>
</svg>
